api.doc.swagger.description                                                                                    = Un indicador \u00E9s una mesura de la intensitat d'un fenomen en l'espaitemps. Aquesta mesura t\u00E9 dades de diferents granularitats espacials (per exemple: illes i municipis), o de diferents unitats temporals (per exemple: anys i mesos). Un sols indicador rares vegades pot proporcionar informaci\u00F3 \u00FAtil sobre fen\u00F2mens complexos com ara la conjuntura econ\u00F2mica, les condicions de vida o l'escolaritzaci\u00F3 entre tants d'altres. Els sistemes d'indicadors estan dissenyats per a aportar informaci\u00F3 m\u00E9s precisa sobre un fenomen, i per a aix\u00F2 s'organitzen en dimensions o \u00E1reas d'an\u00E0lisi, sota les que s'integren els indicadors. L'objectiu d'aquesta API \u00E9s permetre l'acc\u00E9s a dades i metadades de: Sistemes d'indicadors, indicadors i inst\u00E0ncies d'indicadors
api.doc.swagger.paths.geographicalvalues.get.description                                                       = <p>Aquesta petici\u00F3 retorna els valors d'una granularitat geogr\u00E0fica que al seu torn formen part d'un un tema o un sistema d'indicadors espec\u00EDfics.</p><br><p>\u00C9s important tenir en compte que dels par\u00E0metres opcionals (<strong>subjectCode</strong> i <strong>systemCode</strong>) podr\u00E0 estar emplenat un d'ells o cap. En cas que estiguin emplenats tots dos, nom\u00E9s es tindr\u00E0 en compte l'\u00FAltim.</p> <br>
api.doc.swagger.paths.geographicalvalues.get.parameters.geographicalgranularitycode                            = Codi de la granularitat geogr\u00E0fica.
api.doc.swagger.paths.geographicalvalues.get.parameters.subjectCode                                            = Codi del tema del qual es desitgen obtenir els valors geogr\u00E0fics.
api.doc.swagger.paths.geographicalvalues.get.parameters.systemcode                                             = Codi del sistema d'indicadors del qual es desitgen obtenir els valors geogr\u00E0fics.
api.doc.swagger.paths.geographicalvalues.get.summary                                                           = Valors geogr\u00E0fics
api.doc.swagger.paths.geographicalvalues.get.tags                                                              = Taules de valors auxiliars
api.doc.swagger.paths.geographicgranuarities.get.description                                                   = <p>Aquesta petici\u00F3 retorna la llista de granularitats geogr\u00E0fiques tractades en el banc de dades IBESTAT-indicadors. Per exemple granularitat provincial, insular o municipal.</p><br>
api.doc.swagger.paths.geographicgranuarities.get.summary                                                       = Granularitats geogr\u00E0fiques
api.doc.swagger.paths.geographicgranuarities.get.tags                                                          = Taules de valors auxiliars
api.doc.swagger.paths.indicators.code.data.get.description                                                     = <p>Un indicador \u00E9s una mesura utilitzada per a con\u00E8ixer la intensitat d'un fenomen en l'espaitemps. Aquesta mesura es pot referir a diferents granularitats espacials, p.e. illes i municipis, o temporals, p.e. anys i mesos. A trav\u00E9s de la petici\u00F3 data s'aporten les dades completes (per a tots els espaitemps) de l'indicador. D'altra banda a trav\u00E9s de la petici\u00F3 metadata s'ofereixen les metadades que descriuen les caracter\u00EDstiques d'un indicador espec\u00EDfic, permetent la compressi\u00F3 del fet mesurat.</p><br>
api.doc.swagger.paths.indicators.code.data.get.parameters.fields                                               = Permet personalitzar la resposta mitjan\u00E7ant l'exclusi\u00F3 de camps. Els possibles valors s\u00F3n: \\"-observationsMetadata\\". <br> Exemple: fields=-observationsMetadata.
api.doc.swagger.paths.indicators.code.data.get.parameters.granularity                                          = Permet filtrar les observacions mitjan\u00E7ant les granularitats d'aquestes. <br> Exemple: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicators.code.data.get.parameters.indicatorcode                                        = Codi de l'indicador a obtenir.
api.doc.swagger.paths.indicators.code.data.get.parameters.representation                                       = Permet filtrar les dades que s'obtenen en la resposta. Per a aix\u00F2, bastar\u00E0 especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtind\u00E0 tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDEX_OCUPACIO_PLACES] <br/>- ~last=n retornar\u00E0 els \u00FAltims n valors de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.code.data.get.summary                                                         = Observacions d'un indicador
api.doc.swagger.paths.indicators.code.data.get.tags                                                            = Indicadors
api.doc.swagger.paths.indicators.code.get.description                                                          = <p>Un indicador \u00E9s una mesura utilitzada per a con\u00E8ixer la intensitat d'un fenomen en l'espaitemps. Aquesta mesura es pot referir a diferents granularitats espacials, p.e. illes i municipis, o temporals, p.e. anys i mesos. A trav\u00E9s d'aquesta petici\u00F3 s'ofereixen les metadades que descriuen les caracter\u00EDstiques d'un indicador espec\u00EDfic, pementent la compressi\u00F3 del fet mesurat; aix\u00ED mateix a trav\u00E9s de la petici\u00F3 data s'aporten les dades completes (per a tots els espaitemps) de l'indicador.</p><br>
api.doc.swagger.paths.indicators.code.get.parameters.indicatorcode                                             = Codi de l'indicador a obtenir.
api.doc.swagger.paths.indicators.code.get.summary                                                              = Indicador
api.doc.swagger.paths.indicators.code.get.tags                                                                 = Indicadors
api.doc.swagger.paths.indicators.get.description                                                               = <p>Aquesta petici\u00F3 aporta la llista d'indicadors publicats en el banc de dades IBESTAT-indicadors. Un indicador \u00E9s una mesura utilitzada per a con\u00E8ixer la intensitat d'un fenomen en l'espaitemps. Aquesta mesura es pot referir a diferents granularitats espacials o temporals. Per exemple \\"Taxa d'atur\\" \u00E9s un indicador amb diverses granularitats espacials (insular, provincial i auton\u00F2mica) i amb el trimestre com una \u00FAnica granulariad temporal.</p><br>
api.doc.swagger.paths.indicators.get.parameters.fields                                                         = Permet personalitzar la resposta mitjan\u00E7ant l'addici\u00F3 de nous camps. Els possibles valors s\u00F3n: \\"+metadata\\", \\"+data\\" i \\"+observationsMetadata\\". <br> Exemple: fields=+metadata.
api.doc.swagger.paths.indicators.get.parameters.limit                                                          = L\u00EDmit de resultats (n\u00FAmero m\u00E0xim). <br> Exemple: limit=10.
api.doc.swagger.paths.indicators.get.parameters.offset                                                         = Despla\u00E7ament. Resultat a partir del qual es retorna. El valor per defecte \u00E9s 0. <br> Exemple: offset=2.
api.doc.swagger.paths.indicators.get.parameters.order                                                          = Ordre. Els possibles valors s\u00F3n \\"update\\" i \\"id\\" i els criteris d'ordre \\"asc\\" i \\"desc\\". <br> Exemple: order=update asc.
api.doc.swagger.paths.indicators.get.parameters.q                                                              = Consulta. Les metadades sobre els quals es poden construir les cerques s\u00F3n: \\"id\\", \\"subjectCode\\", \\"geographicalValue\\" i \\"geographicalGranularity\\".<br> Exemples: <br>q=id EQ \\"ATUR_REGISTRAT\\" <br> q=subjectCode EQ \\"EDUCACIO\\" AND geographicalValue EQ \\"\u00C9S\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=id IN (\\"CODE-1\\", \\"CODE-2\\").
api.doc.swagger.paths.indicators.get.parameters.representation                                                 = Permet filtrar les dades que s'obtenen en la resposta. El seu \u00FAs nom\u00E9s t\u00E9 sentit quan s'ha incl\u00F2s \\"+data\\" i/o \\"+observationsMetadata\\". Per a aix\u00F2, bastar\u00E0 amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDEXI_OCUPACION_PLACES] <br/>- ~last=n retornar\u00E0 els \u00FAltims n valoris de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.get.summary                                                                   = Llistat d'indicadors
api.doc.swagger.paths.indicators.get.tags                                                                      = Indicadors
api.doc.swagger.paths.indicatorssystems.code.get.description                                                   = <p>Aquesta petici\u00F3 ofereix les metadades d'un sistema d'indicadors publicat en el banc de dades IBESTAT-indicadors. Els indicadors s\u00F3n estad\u00EDstiques simples o compostes, no obstant aix\u00F2 un sols indicador rares vegades pot proporcionar informaci\u00F3 \u00FAtil sobre fen\u00F2mens complexos com ara la conjuntura econ\u00F2mica, les condicions de vida, l'escolaritzaci\u00F3 o altres. Els sistemes d'indicadors generalment estan dissenyats per a generar  informaci\u00F3 m\u00E9s precisa sobre les condicions d'un fenomen; i per a aix\u00F2 s'organitzen en dimensions o \u00E0rees d'an\u00E0lisis, sota les quals s'integren els indicadors. A l'IBESTAT un sistema d'indicadors es tracta com una operaci\u00F3 estad\u00EDstica, per la qual cosa es pot consultar m\u00E9s informaci\u00F3 del sistema en la API d'operacions.</p><br>
api.doc.swagger.paths.indicatorssystems.code.get.parameters.indicatorsystemcode                                = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.get.summary                                                       = Sistema d'indicadors
api.doc.swagger.paths.indicatorssystems.code.get.tags                                                          = Sistemes d'indicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.description                      = <p>Aquesta petici\u00F3 retorna les dades d'una inst\u00E0ncia d'indicadors associada a un sistema d'indicadors espec\u00EDfic. Una inst\u00E0ncia d'un indicador no \u00E9s m\u00E9s que una consulta espaciotemporal d'un indicador a l'hora d'incorporar-lo a un sistema d'indicadors concret. Per exemple, l'indicador Atur registrat s'incorpora al sistema Anuari d'Indicadors Municipals com una consulta (inst\u00E0ncia d'indicador) a trav\u00E9s de la qual se seleccionen les dades municipals i anuals d'aquest indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.fields                = Permet personalitzar la resposta mitjan\u00E7ant l'exclusi\u00F3 de camps. Els possibles valors s\u00F3n: \\"-observationsMetadata\\". <br> Exemple: fields=-observationsMetadata.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.granularity           = Permet filtrar les observacions mitjan\u00E7ant les granularitats d'aquestes. <br> Exemple: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.indicatorinstancecode = Codi de la inst\u00E0ncia a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.indicatorsystemcode   = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.representation        = Permet filtrar les dades que s'obtenen en la resposta. Per a aix\u00F2, bastar\u00E0 amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDEXI_OCUPACION_PLACES] <br/>- ~last=n retornar\u00E0 els \u00FAltims n valors de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre DATA1 i DATA2, totes dues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.summary                          = Observacions inst\u00E0ncia d'indicador
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.tags                             = Sistemes d'indicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.description                           = <p>Aquesta petici\u00F3 retorna les metadades d'una inst\u00E0ncia d'indicadors associada a un sistema d'indicadors espec\u00EDfic. Una inst\u00E0ncia d'un indicador no \u00E9s m\u00E9s que una consulta espaciotemporal d'un indicador a l'hora d'incorporar-lo a un sistema d'indicadors concret. Per exemple, l'indicador Atur registrat s'incorpora al sistema Anuari d'Indicadors Municipals com una consulta (inst\u00E0ncia d'indicador) a trav\u00E9s de la qual se seleccionen les dades municipals i anuals d'aquest indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.parameters.indicatorinstancecode      = Codi de la inst\u00E0ncia a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.parameters.indicatorsystemcode        = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.summary                               = Inst\u00E0ncia d'un sistema d'indicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.tags                                  = Sistemes d'indicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.description                                = <p>Aquesta petici\u00F3 retorna les inst\u00E0ncias d'indicadors associades a un sistema d'indicadors espec\u00EDfic. Una inst\u00E0ncia d'un indicador no \u00E9s m\u00E9s que una consulta espaciotemporal d'un indicador a l'hora d'incorporar-lo a un sistema d'indicadors concret. Per exemple, l'indicador Atur registrat s'incorpora al sistema Anuari d'Indicadors Municipals com una consulta (inst\u00E0ncia d'indicador) a trav\u00E9s de la qual se seleccionen les dades municipals i anuals d'aquest indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.fields                          = Permet personalitzar la resposta mitjan\u00E7ant l'addici\u00F3 de nous camps. Els possibles valors s\u00F3n: \\"+metadata\\", \\"+data\\" i \\"+observationsMetadata\\". <br> Exemple: fields=+metadata.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.granularity                     = Permet filtrar les observacions mitjan\u00E7ant les granularitats d'aquestes. El seu \u00FAs nom\u00E9s t\u00E9 sentit quan s'ha incl\u00F2s \\"+data\\" i/o \\"+observationsMetadata\\". <br> Exemple: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.indicatorsystemcode             = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.limit                           = L\u00EDmit de resultats (n\u00FAmero m\u00E0xim). <br> Exemple: limit=10.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.offset                          = Despla\u00E7ament. Resultat a partir del qual es retorna. El valor per defecte \u00E9s 0. <br> Exemple: offset=2.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.order                           = Ordre. Els possibles valors s\u00F3n \\"update\\" i \\"id\\" i els criteris d'ordre \\"asc\\" i \\"desc\\". <br> Exemple: order=update asc.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.q                               = Consulta. Les metadades sobre les quals es poden construir les cerques s\u00F3n: \\"id\\", \\"geographicalValue\\" i \\"geographicalGranularity\\".<br> Exemples: <br>q=id EQ \\"INDICADORS_MUNICIPALS\\" <br> q=geographicalValue EQ \\"\u00C9S\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=id IN (\\"CODE-1\\", \\"CODE-2\\").
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.representation                  = Permet filtrar les dades que s'obtenen en la resposta. El seu \u00FAs nom\u00E9s t\u00E9 sentit quan s'ha incl\u00F2s \\"+data\\" i/o \\"+observationsMetadata\\". Per a aix\u00F2, bastar\u00E0 amb especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna d'elles. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els valors existents. De manera addicional, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDEXI_OCUPACION_PLACES] <br/>- ~last=n retornar\u00E0 els \u00FAltims n valoris de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA retornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 retornar\u00E0 les dates entre FECHA1 i FECHA2, totes dues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.summary                                    = Inst\u00E0ncies de sistema d'indicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.tags                                       = Sistemes d'indicadors
api.doc.swagger.paths.indicatorssystems.get.description                                                        = <p>Aquesta petici\u00F3 aporta la llista de sistemes d'indicadors publicats en el banc de dades IBESTAT-indicadors. Els indicadors s\u00F3n estad\u00EDstiques simples o compostes, no obstant aix\u00F2 un sols indicador rares vegades pot proporcionar informaci\u00F3 \u00FAtil sobre fen\u00F2mens complexos com ara la conjuntura econ\u00F2mica, les condicions de vida, l'escolaritzaci\u00F3 o altres. Els sistemes d'indicadors generalment estan dissenyats per a generar m\u00E9s i m\u00E9s precisa informaci\u00F3 sobre les condicions d'un fenomen; i per a aix\u00F2 s'organitzen en dimensions o \u00E0rees d'an\u00E0lisis, sota les quals s'integren els indicadors. En L'IBESTAT un sistema d'indicadors es tracta com una operaci\u00F3 estad\u00EDstica, per la qual cosa es pot consultar m\u00E9s informaci\u00F3 del sistema en la API d'operacions.</p><br>
api.doc.swagger.paths.indicatorssystems.get.parameters.limit                                                   = L\u00EDmit de resultats (n\u00FAmero m\u00E0xim). <br> Exemple: limit=10.
api.doc.swagger.paths.indicatorssystems.get.parameters.offset                                                  = Despla\u00E7ament. Resultat a partir del qual es retorna. El valor per defecte \u00E9s 0. <br> Exemple: offset=2.
api.doc.swagger.paths.indicatorssystems.get.summary                                                            = Llistat de sistemes d'indicadors
api.doc.swagger.paths.indicatorssystems.get.tags                                                               = Sistemes d'indicadors
api.doc.swagger.paths.responses.200                                                                            = \u00C8xit. Indica que la petici\u00F3 ha estat resolta correctament
api.doc.swagger.paths.subjects.get.description                                                                 = <p>Aquesta petici\u00F3 retorna els temes en els quals l'IBESTAT classifica les seves operacions estad\u00EDstiques.</p><br>
api.doc.swagger.paths.subjects.get.summary                                                                     = Temes estad\u00EDstics
api.doc.swagger.paths.subjects.get.tags                                                                        = Taules de valors auxiliars
api.doc.swagger.paths.timegranularities.get.description                                                        = <p>Aquesta petici\u00F3 retorna la llista de granularitats temporals tractades en el banc de dades IBESTAT-indicadors ordenats de major a menor granularitat. Per exemple granularitat anual, trimestral o mensual.</p><br>
api.doc.swagger.paths.timegranularities.get.summary                                                            = Granularitats temporals
api.doc.swagger.paths.timegranularities.get.tags                                                               = Taules de valors auxiliars
