api.doc.swagger.description                                                                                    = Un indicador es una mesura de la intensitat d'un fen\u00F3 en l'espai-temps. Aquesta mesura t\u00E9 dades de diferents granularitats espacials (per exemple: illes i municipis), o de diferents unitats temporals (per exemple: anys i mesos). Un sol indicador rarament pot proporcionar informaci\u00F3 sobre fenomen complexos com ara la conjuntura econ\u00F3mica, les condicions de vida o l'escolaritzaci\u00F3 entre tants altres. Els sistemes d'indicadors estan dissenyats per aportar informaci\u00F3 m\u00E9s precisa sobre un fenomen, i per a aix\u00F2 s'organitzen en dimensions o \u00E0rees d'an\u00E1lisi, sota les quals s'integren els indicadors. L'objectiu d'aquesta API \u00E9s permetre accedir a dades i metadades de: Indicator systems, indicadors i inst\u00E0ncies d'indicadors
api.doc.swagger.paths.geographicalvalues.get.description                                                       = <p>Aquesta petici\u00F3 torna els valors d'una granularitat geogr\u00E0fica que alhora formen part d'un tema o sistema d'indicadors espec\u00EDfics.</p><br><p>\u00C9s important tenir en compte que dels par\u00E0metres opcionals ( <strong>subjectCode</strong> i <strong>systemCode</strong>) podreu emplenar-ne un o cap. En cas que tots dos estiguin emplenats, nom\u00E9s es tindr\u00E0 en compte l'\u00FAltim.</p> <br>
api.doc.swagger.paths.geographicalvalues.get.parameters.geographicalgranularitycode                            = Codi de la granularitat geogr\u00E0fica.
api.doc.swagger.paths.geographicalvalues.get.parameters.subjectCode                                            = C\u00F3digo del tema del que se desean obtener los valores geogr\u00E1ficos.
api.doc.swagger.paths.geographicalvalues.get.parameters.systemcode                                             = Codi del sistema d'indicadors del qual es volen obtenir els valors geogr\u00E0fics.
api.doc.swagger.paths.geographicalvalues.get.summary                                                           = Valors geogr\u00E0fics
api.doc.swagger.paths.geographicalvalues.get.tags                                                              = Taules de valors auxiliars
api.doc.swagger.paths.geographicgranuarities.get.description                                                   = <p>Aquesta petici\u00F3 retorna la llista de granularitats geogr\u00E0fiques tractades a e-Indicadores. Per exemple granularitat provincial, insular o municipal.</p><br>
api.doc.swagger.paths.geographicgranuarities.get.summary                                                       = Granularitats geogr\u00E0fiques
api.doc.swagger.paths.geographicgranuarities.get.tags                                                          = Taules de valors auxiliars
api.doc.swagger.paths.indicators.code.data.get.description                                                     = <p>Un indicador \u00E9s una mesura utilitzada per con\u00E8ixer la intensitat d'un fenomen a l'espai-temps. Aquesta mesura es pot referir a diferents granularitats espacials, p.e. illes i municipis, o temporals, p.e. anys i mesos. A trav\u00E9s de la petici\u00F3 data s'aporten les dades completes (per a tots els espai-temps) de l'indicador. D'altra banda, a trav\u00E9s de la petici\u00F3 metadata s'ofereixen les metadades que descriuen les caracter\u00EDstiques d'un indicador espec\u00EDfic, i es permet la compressi\u00F3 del fet mesurat.</p><br>
api.doc.swagger.paths.indicators.code.data.get.parameters.fields                                               = Permet personalitzar la resposta mitjan\u00E7ant lexclusi\u00F3 de camps. Els possibles valors s\u00F3n: \\"-observationsMetadata\\". <br> Exemple: fields=-observationsMetadata.
api.doc.swagger.paths.indicators.code.data.get.parameters.granularity                                          = Permet filtrar les observacions mitjan\u00E7ant les granularitats de les mateixes. <br> Exemple: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicators.code.data.get.parameters.indicatorcode                                        = Codi de lindicador a obtenir.
api.doc.swagger.paths.indicators.code.data.get.parameters.representation                                       = Permet filtrar les dades que s'obtenen a la resposta. Per fer-ho, n'hi haur\u00E0 prou d'especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els par\u00E0metres existents. A m\u00E9s, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last= n tornar\u00E0 els darrers n valors de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA tornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=DATA1;DATA2 tornar\u00E0 les dates entre DATA1 i DATA2, ambdues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.code.data.get.summary                                                         = Observacions d'un indicador
api.doc.swagger.paths.indicators.code.data.get.tags                                                            = Indicadors
api.doc.swagger.paths.indicators.code.get.description                                                          = <p>Un indicador \u00E9s una mesura utilitzada per con\u00E8ixer la intensitat d'un fenomen a l'espai-temps. Aquesta mesura es pot referir a diferents granularitats espacials, p.e. illes i municipis, o temporals, p.e. anys i mesos. A trav\u00E9s d'aquesta petici\u00F3 s'ofereixen les metadades que descriuen les caracter\u00EDstiques d'un indicador espec\u00EDfic, i es permet la compressi\u00F3 del fet mesurat; aix\u00ED mateix a trav\u00E9s de la petici\u00F3 data s'aporten les dades completes (per a tots els espai-temps) de l'indicador.</p><br>
api.doc.swagger.paths.indicators.code.get.parameters.indicatorcode                                             = Codi de lindicador a obtenir.
api.doc.swagger.paths.indicators.code.get.summary                                                              = Indicador
api.doc.swagger.paths.indicators.code.get.tags                                                                 = Indicadors
api.doc.swagger.paths.indicators.get.description                                                               = <p>Aquesta petici\u00F3 aporta la llista d'indicadors publicats a e-Indicadores. Un indicador \u00E9s una mesura utilitzada per a con\u00E8ixer la intensitat d'un fenomen en l'espai-temps. Aquesta mesura es pot referir a diferents granularitats espacials o temporals. Per exemple \\"Taxa d'atur\\" \u00E9s un indicador amb diverses granularitats espacials (insular, provincial i auton\u00F2mica) i amb el trimestre com una \u00FAnica granularitat temporal.</p><br>
api.doc.swagger.paths.indicators.get.parameters.fields                                                         = Permet personalitzar la resposta mitjan\u00E7ant l'addici\u00F3 de camps nous. Els possibles valors s\u00F3n: \\"+metadata\\", \\"+data\\" i \\"+observationsMetadata\\". <br> Exemple: fields=+metadata.
api.doc.swagger.paths.indicators.get.parameters.limit                                                          = L\u00EDmit de resultats (n\u00FAmero m\u00E0xim). <br> Exemple: limit=10.
api.doc.swagger.paths.indicators.get.parameters.offset                                                         = Despla\u00E7ament. Resultat a partir del que es torna. El valor per defecte \u00E9s 0. <br> Exemple: offset=2.
api.doc.swagger.paths.indicators.get.parameters.order                                                          = Ordre. Els possibles valors s\u00F3n \\"update\\" i \\"id\\" i els criteris d'ordre \\"asc\\" i \\"desc\\". <br> Exemple: order=update asc.
api.doc.swagger.paths.indicators.get.parameters.q                                                              = Consulta. Les metadades sobre les quals es poden construir les cerques s\u00F3n: \\"id\\", \\"subjectCode\\", \\"geographicalValue\\" i \\"geographicalGranularity\\".<br> Exemples: < q=id EQ \\"PARO_REGISTRADO\\" <br> q=subjectCode EQ \\"EDUCACION\\" AND geographicalValue EQ \\"ES\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\"<br> q=id IN (\\"CODE-1\\", \\"CODE-2\\").
api.doc.swagger.paths.indicators.get.parameters.representation                                                 = Permet filtrar les dades que s'obtenen a la resposta. El seu \u00FAs nom\u00E9s t\u00E9 sentit quan s'ha incl\u00F2s \\"+data\\" i/o \\"+observationsMetadata\\". Per fer-ho, n'hi haur\u00E0 prou d'especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els par\u00E0metres existents. A m\u00E9s, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last= n tornar\u00E0 els darrers n valors de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA tornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=DATA1;DATA2 tornar\u00E0 les dates entre DATA1 i DATA2, ambdues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.get.summary                                                                   = Llistat d'indicadors
api.doc.swagger.paths.indicators.get.tags                                                                      = Indicadors
api.doc.swagger.paths.indicatorssystems.code.get.description                                                   = <p>Aquesta petici\u00F3 ofereix les metadades d'un sistema d'indicadors publicat a e-Indicadores. Els indicadors s\u00F3n estad\u00EDstiques simples o compostes, per\u00F2 un sol indicador poques vegades pot proporcionar informaci\u00F3 \u00FAtil sobre fen\u00F2mens complexos com ara la conjuntura econ\u00F2mica, les condicions de vida, l'escolaritzaci\u00F3 o altres. Els sistemes dindicadors generalment estan dissenyats per generar informaci\u00F3 m\u00E9s precisa sobre les condicions d'un fenomen; i per aix\u00F2 s'organitzen en dimensions o \u00E0rees d'an\u00E0lisi, sota les quals s'integren els indicadors. Un sistema d'indicadors es tracta com una operaci\u00F3 estad\u00EDstica, per la qual cosa es pot consultar m\u00E9s informaci\u00F3 del sistema a l'API d'operacions.</p><br>
api.doc.swagger.paths.indicatorssystems.code.get.parameters.indicatorsystemcode                                = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.get.summary                                                       = Sistema de indicadores
api.doc.swagger.paths.indicatorssystems.code.get.tags                                                          = Sistemes dindicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.description                      = <p>Aquesta petici\u00F3 torna les dades d'una inst\u00E0cia d'indicadors associada a un sistema d'indicadors espec\u00EDfic. Una inst\u00E0ncia d'un indicador no \u00E9s m\u00E9s que una consulta espai-temporal d'un indicador al'hora d'incorporar-lo a un sistema d'indicadors concret. Per exemple, l'indicador Atur registrat s'incorpora al sistema Anuari d'Indicadors Municipals com a consulta (inst\u00E0ncia d'indicador) a trav\u00E9s de la qual se seleccionen les dades municipals i anuals del dit indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.fields                = Permet personalitzar la resposta mitjan\u00E7ant lexclusi\u00F3 de camps. Els possibles valors s\u00F3n: \\"-observationsMetadata\\". <br> Exemple: fields=-observationsMetadata.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.granularity           = Permet filtrar les observacions mitjan\u00E7ant les granularitats de les mateixes. <br> Exemple: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.indicatorinstancecode = Codi de la inst\u00E0ncia a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.indicatorsystemcode   = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.representation        = Permet filtrar les dades que s'obtenen a la resposta. Per fer-ho, n'hi haur\u00E0 prou d'especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els par\u00E0metres existents. A m\u00E9s, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last= n tornar\u00E0 els darrers n valors de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA tornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=DATA1;DATA2 tornar\u00E0 les dates entre DATA1 i DATA2, ambdues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.summary                          = Observacions inst\u00E0ncia dindicador
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.tags                             = Sistemes dindicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.description                           = <p>Aquesta petici\u00F3 torna les metadades d'una inst\u00E0ncia d'indicadors associada a un sistema d'indicadors espec\u00EDfic. Una inst\u00E0ncia d'un indicador no \u00E9s m\u00E9s que una consulta espai-temporal d'un indicador al'hora d'incorporar-lo a un sistema d'indicadors concret. Per exemple, l'indicador Atur registrat s'incorpora al sistema Anuari d'Indicadors Municipals com a consulta (inst\u00E0ncia d'indicador) a trav\u00E9s de la qual se seleccionen les dades municipals i anuals del dit indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.parameters.indicatorinstancecode      = Codi de la inst\u00E0ncia a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.parameters.indicatorsystemcode        = Codi del sistema a obtenir.
