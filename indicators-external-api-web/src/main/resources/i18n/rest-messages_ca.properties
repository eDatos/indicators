api.doc.swagger.paths.timegranularities.get.description                                                        = <p>Aquesta petici\u00F3 torna la llista de granularitats temporals tractades a e-Indicadores ordenades de major a menor granularitat. Per exemple granularitat anual, trimestral o mensual.</p><br>
