api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.tags                                  = Sistemes dindicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.description                                = <p>Aquesta petici\u00F3 torna les inst\u00E0cies d'indicadors associades a un sistema d'indicadors espec\u00EDfic. Una inst\u00E0ncia d'un indicador no \u00E9s m\u00E9s que una consulta espai-temporal d'un indicador al'hora d'incorporar-lo a un sistema d'indicadors concret. Per exemple, l'indicador Atur registrat s'incorpora al sistema Anuari d'Indicadors Municipals com a consulta (inst\u00E0ncia d'indicador) a trav\u00E9s de la qual se seleccionen les dades municipals i anuals del dit indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.fields                          = Permet personalitzar la resposta mitjan\u00E7ant l'addici\u00F3 de camps nous. Els possibles valors s\u00F3n: \\"+metadata\\", \\"+data\\" i \\"+observationsMetadata\\". <br> Exemple: fields=+metadata.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.granularity                     = Permet filtrar les observacions mitjan\u00E7ant les granularitats de les mateixes. El seu \u00FAs nom\u00E9s t\u00E9 sentit quan s'ha incl\u00F2s \\"+data\\" i/o \\"+observationsMetadata\\". <br> Exemple: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.indicatorsystemcode             = Codi del sistema a obtenir.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.limit                           = L\u00EDmit de resultats (n\u00FAmero m\u00E0xim). <br> Exemple: limit=10.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.offset                          = Despla\u00E7ament. Resultat a partir del que es torna. El valor per defecte \u00E9s 0. <br> Exemple: offset=2.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.order                           = Ordre. Els possibles valors s\u00F3n \\"update\\" i \\"id\\" i els criteris d'ordre \\"asc\\" i \\"desc\\". <br> Exemple: order=update asc.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.q                               = Consulta. Les metadades sobre les quals es poden construir les cerques s\u00F3n: \\"id\\", \\"geographicalValue\\" i \\"geographicalGranularity\\".<br> Exemples: <br>q=id EQ \\"INDICADORES_MUNICIPALES\\" <br> q=geographicalValue EQ \\"ES\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=id IN (\\"CODE-1\\" , \\"CODE-2\\").
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.representation                  = Permet filtrar les dades que s'obtenen a la resposta. El seu \u00FAs nom\u00E9s t\u00E9 sentit quan s'ha incl\u00F2s \\"+data\\" i/o \\"+observationsMetadata\\". Per fer-ho, n'hi haur\u00E0 prou d'especificar les dimensions que es volen filtrar i els valors a obtenir per a cadascuna. De les dimensions que no s'especifiqui cap filtre s'obtindran tots els par\u00E0metres existents. A m\u00E9s, les dimensions temporals permeten l'\u00FAs dels modificadors ~last, ~after i ~range. <br/>Exemples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last= n tornar\u00E0 els darrers n valors de la dimensi\u00F3 temporal. Exemple d'\u00FAs: representation=TIME[~last=2] <br/>- ~after=DATA tornar\u00E0 les dates posteriors a DATA, inclosa ella mateixa. Exemple d'\u00FAs: representation=TIME[~after=2012-M02] <br/>- ~range=DATA1;DATA2 tornar\u00E0 les dates entre DATA1 i DATA2, ambdues incloses. Exemple d'\u00FAs: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.summary                                    = Inst\u00E0ncies del sistema d'indicadors
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.tags                                       = Sistemes dindicadors
api.doc.swagger.paths.indicatorssystems.get.description                                                        = <p>Aquesta petici\u00F3 aporta la llista de sistemes d'indicadors publicats a e-Indicadores. Els indicadors s\u00F3n estad\u00EDstiques simples o compostes, per\u00F2 un sol indicador poques vegades pot proporcionar informaci\u00F3 \u00FAtil sobre fen\u00F2mens complexos com ara la conjuntura econ\u00F2mica, les condicions de vida, l'escolaritzaci\u00F3 o altres. Els sistemes dindicadors generalment estan dissenyats per generar m\u00E9s i m\u00E9s precisa informaci\u00F3 sobre les condicions d'un fenomen; i per aix\u00F2 s'organitzen en dimensions o \u00E0rees d'an\u00E0lisi, sota les quals s'integren els indicadors. Un sistema d'indicadors es tracta com una operaci\u00F3 estad\u00EDstica, per la qual cosa es pot consultar m\u00E9s informaci\u00F3 del sistema a l'API d'operacions.</p><br>
api.doc.swagger.paths.indicatorssystems.get.parameters.limit                                                   = L\u00EDmit de resultats (n\u00FAmero m\u00E0xim). <br> Exemple: limit=10.
api.doc.swagger.paths.indicatorssystems.get.parameters.offset                                                  = Despla\u00E7ament. Resultat a partir del que es torna. El valor per defecte \u00E9s 0. <br> Exemple: offset=2.
api.doc.swagger.paths.indicatorssystems.get.summary                                                            = Llistat de sistemes dindicadors
api.doc.swagger.paths.indicatorssystems.get.tags                                                               = Sistemes dindicadors
api.doc.swagger.paths.responses.200                                                                            = \u00C8xit. Indica que la petici\u00F3 ha estat resolta correctament
api.doc.swagger.paths.subjects.get.description                                                                 = <p>Aquesta petici\u00F3 torna els temes en qu\u00E8 l'Institut classifica les seves operacions estad\u00EDstiques.</p><br>
api.doc.swagger.paths.subjects.get.summary                                                                     = Temes estad\u00EDstics
