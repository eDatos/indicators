api.doc.swagger.definitions.quantity.properties.baselocation                                                   = Base espacial per a un indicador tipus \u00EDndex (index) espacial o temporal. L'exemple m\u00E9s caracter\u00EDstic d'\u00EDndexs espacials s\u00F3n les Paritats de Poder Adquisitiu (PPA) que comparen els nivells de preus entre territoris, i el territori base \u00E9s la refer\u00E8ncia 100. Per exemple les PPA de Can\u00E0ries comparen els nivells de preus entre illes, sent el territori base Can\u00E0ries. Metadada associada al tipus de mesura index.
api.doc.swagger.definitions.quantity.properties.basequantitylink                                               = Refer\u00E8ncia a lindicador sobre el qual es calcula una taxa de variaci\u00F3. Metadada associada al tipus de mesura changerate.
api.doc.swagger.definitions.quantity.properties.basetime                                                       = Base temporal d'un indicador tipus \u00EDndex (index) temporal. Per exemple, 2010. Metadada associada al tipus de mesura index.
api.doc.swagger.definitions.quantity.properties.basevalue                                                      = Valor de refer\u00E8ncia d'un \u00EDndex (index), generalment baseValue = 100. Metadada associada al tipus de mesura index.
api.doc.swagger.definitions.quantity.properties.decimalplaces                                                  = Especifica el nombre de decimals a utilitzar per visualitzar els valors d'un concepte m\u00E8tric.
api.doc.swagger.definitions.quantity.properties.denominatorlink                                                = Un altre indicador del sistema que \u00E9s el denominador de lindicador tipus proporci\u00F3. Per exemple, per a l'indicador \\"taxa d'atur\\" seria l'indicador \\"poblaci\u00F3 activa\\". Metadada associada als seg\u00FCents tipus de mesura: fraction, ratio, rate, index i changerate.
api.doc.swagger.definitions.quantity.properties.ispercentege                                                   = Atribut boole\u00E0 que pren el valor TRUE si una fracci\u00F3 \u00E9s un percentatge i FALSE en cas contrari. Metadada associat als seg\u00FCents tipus de mesura: r\u00E0tio, rate, index i changerate.
api.doc.swagger.definitions.quantity.properties.max                                                            = Especifica el valor m\u00E0xim que la magnitud pot prendre. En el cas d'una magnitud referenciada en una escala d'interval (o d'intensitat) indica el valor superior de l'escala. Per exemple, per a l'\u00EDndex de desenvolupament hum\u00E0; max = 1. Metadada associada als seg\u00FCents tipus de mesura: magnitude, fraction, ratio, rate, index i changerate.
api.doc.swagger.definitions.quantity.properties.min                                                            = Especifica el valor m\u00EDnim que pot agafar la magnitud. En el cas d'una magnitud referenciada en una escala d'interval (o d'intensitat) indica el valor inferior de l'escala. Per exemple, per a l'\u00EDndex de desenvolupament hum\u00E0; min = 0. Metadada associada als seg\u00FCents tipus de mesura: magnitude, fraction, ratio, rate, index i changerate.
api.doc.swagger.definitions.quantity.properties.numeratorlink                                                  = Un altre indicador del sistema que \u00E9s el numerador de lindicador tipus proporci\u00F3. Per exemple, per a l'indicador \\"taxa d'atur\\" seria l'indicador \\"poblaci\u00F3 parada\\". Metadada associada als seg\u00FCents tipus de mesura: fraction, ratio, rate, index i changerate.
api.doc.swagger.definitions.quantity.properties.percentegeof                                                   = Si estem davant d'un percentatge, aquest atribut ofereix un text descriptiu que es pot utilitzar per mostrar-se al costat del n\u00FAmero i especifica de qu\u00E8 es tracta aquest percentatge. Per exemple, la m\u00E8trica \\"taxa de desocupaci\u00F3\\" pot tenir un atribut PercentageOf \\"% de la poblaci\u00F3 activa\\" perqu\u00E8 el valor es llegeixi com a \\"10,5% de la poblaci\u00F3 activa\\". Metadada associat als seg\u00FCents tipus de mesura: r\u00E0tio, rate, index i changerate.
api.doc.swagger.definitions.quantity.properties.significantdigits                                              = Especifica el nombre de d\u00EDgits significatius per utilitzar quan es mostren els valors d'un concepte m\u00E8tric.
api.doc.swagger.definitions.quantity.properties.type                                                           = Hi ha diferents tipus de mesura (type) i associats a cadascuna, diferents metadades que especifiquen millor aquesta mesura: mesura (quantity), quantitat (amount), magnitud (magnitude), fracci\u00F3 (fraction), r\u00E0tio (r\u00E0tio), taxa (rate), \u00EDndex (index), taxa de variaci\u00F3 (changerate). S'ha fet servir la classificaci\u00F3 utilitzada per Google, al seu est\u00E0ndard Dataset Publishing Language (DSPL).
api.doc.swagger.definitions.quantity.properties.unit                                                           = Definiu la unitat de mesura d'un indicador. Una unitat de mesura \u00E9s una quantitat estandarditzada d'una determinada magnitud, definida i adoptada per convenci\u00F3 o per llei, per exemple unitats f\u00EDsica (kg, mm, \u00B0C, \u00B0F) o unitats monet\u00E0ries (euros, pessetes, d\u00F2lars). Qualsevol valor d'una quantitat f\u00EDsica pot expressar-se com un m\u00FAltiple de la unitat de mesura. Una unitat de mesura pren el valor a partir d'un patr\u00F3 o d'una composici\u00F3 d'altres unitats definides pr\u00E8viament. Les primeres unitats es coneixen com a unitats b\u00E0siques o de base (fonamentals), mentre que les segones s'anomenen unitats derivades. <br>Tamb\u00E9 considerem com a unitats de mesura les especificacions de simples recomptes (per exemple persones, vehicles, habitatges).
api.doc.swagger.definitions.quantity.properties.unitmultiplier                                                 = Literal que especifica el multiplicador de la unitat de mesura. Per exemple \\"Milers de persones\\". Metadada associada a tots els tipus de mesura.
api.doc.swagger.definitions.quantity.properties.unitsymbol                                                     = S\u00EDmbol associat a la unitat de mesura, per exemple \\"km\\" per a quil\u00F2metres. <br>Metadat associat a tots els tipus de mesura.
api.doc.swagger.definitions.quantity.properties.unitsymbolposition                                             = Posici\u00F3 del s\u00EDmbol de la unitat de mesura, que pot ser davant o darrere de la xifra. <br>Metadat associat a tots els tipus de mesura.
