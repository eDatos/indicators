api.doc.swagger.definitions.quantity.properties.baselocation = Spatial base for a spatial or temporal index type indicator. The most characteristic example of spatial indices are the Purchasing Power Parities (PPP) that compare price levels between territories, the base territory being the reference 100. For example, the Canary Islands PPPs compare price levels between islands, the territory being Canary Islands base. Metadata associated with the type of measurement index.
api.doc.swagger.definitions.quantity.properties.basequantitylink = Reference to the indicator on which a variation rate is calculated. Metadata associated with the type of measure changerate.
api.doc.swagger.definitions.quantity.properties.basetime = Time base of a time index type indicator. For example, 2010. Metadata associated with the type of measurement index.
api.doc.swagger.definitions.quantity.properties.basevalue = Reference value of an index (index), generally baseValue = 100. Metadata associated with the type of measurement index.
api.doc.swagger.definitions.quantity.properties.decimalplaces = Specifies the number of decimal places to use to display the values of a metric concept.
api.doc.swagger.definitions.quantity.properties.denominatorlink = Another indicator of the system that is the denominator of the indicator type proportion. For example, for the indicator \\"unemployment rate\\" it would be the indicator \\"active population\\". Metadata associated with the following measurement types: fraction, ratio, rate, index, and changerate.
api.doc.swagger.definitions.quantity.properties.ispercentege = Boolean attribute that takes the value TRUE if a fraction is a percentage and FALSE otherwise. Metadata associated with the following types of measurement: ratio, rate, index and changerate.
api.doc.swagger.definitions.quantity.properties.max = Specifies the maximum value that the magnitude can take. In the case of a magnitude referenced on an interval (or intensity) scale, it indicates the upper value of the scale. For example, for the Human Development Index; max = 1. Metadata associated with the following measurement types: magnitude, fraction, ratio, rate, index and changerate.
api.doc.swagger.definitions.quantity.properties.min = Specifies the minimum value that the magnitude can take. In the case of a magnitude referenced on an interval (or intensity) scale, it indicates the lower value of the scale. For example, for the Human Development Index; min = 0. Metadata associated with the following types of measurement: magnitude, fraction, ratio, rate, index and changerate.
api.doc.swagger.definitions.quantity.properties.numeratorlink = Another system indicator that is the numerator of the proportion type indicator. For example, for the indicator \\"unemployment rate\\" it would be the indicator \\"unemployed population\\". Metadata associated with the following measurement types: fraction, ratio, rate, index, and changerate.
api.doc.swagger.definitions.quantity.properties.percentegeof = If we are dealing with a percentage, this attribute provides descriptive text that can be used to display next to the number and specifies what the percentage is. For example, the metric \\"unemployment rate\\" can have a PercentageOf attribute \\"% of the workforce\\" so that the value is read as \\"10.5% of the workforce\\". Metadata associated with the following types of measurement: ratio, rate, index and changerate.
api.doc.swagger.definitions.quantity.properties.significantdigits = Specifies the number of significant digits to use when displaying the values of a metric concept.
api.doc.swagger.definitions.quantity.properties.type = There are different types of measurement (type) and associated with each of them, different metadata that better specify that measurement: measurement (quantity), quantity (amount), magnitude (magnitude), fraction (fraction), ratio (ratio), rate (rate), index (index), rate of change (changerate). The classification used by Google has been used, in its standard Dataset Publishing Language (DSPL).
api.doc.swagger.definitions.quantity.properties.unit = Defines the unit of measure for an indicator. A unit of measurement is a standardized quantity of a certain magnitude, defined and adopted by convention or by law, for example: physical units (kg, mm, °C, °F) or monetary units (euros, pesetas, dollars). Any value of a physical quantity can be expressed as a multiple of the unit of measure. A unit of measurement takes its value from a pattern or from a composition of other previously defined units. The first units are known as basic or base (fundamental) units, while the second are called derived units. <br>We also consider simple count specifications (eg people, vehicles, homes) as units of measure.
api.doc.swagger.definitions.quantity.properties.unitmultiplier = A literal that specifies the multiplier of the unit of measure. For example \\"Thousands of people\\". Metadata associated with all types of measurement.
api.doc.swagger.definitions.quantity.properties.unitsymbol = Symbol associated with the unit of measurement, for example \\"km\\" for kilometers. <br>Metadata associated with all types of measurement.
api.doc.swagger.definitions.quantity.properties.unitsymbolposition = Position of the unit of measure symbol, which can be before or after the figure. <br>Metadata associated with all types of measurement.
