api.doc.swagger.paths.geographicgranuarities.get.tags = Tables values auxiliary
api.doc.swagger.paths.geographicgranuarities.get.description = <p>This request returns the list of Geographic granularities processed in the ISTAC-indicadores data bank. For example, provincial, insular or municipal granularity.</p><br>
api.doc.swagger.paths.geographicgranuarities.get.summary = Geographic granularities
api.doc.swagger.paths.geographicalvalues.get.tags = Tables values auxiliary
api.doc.swagger.paths.geographicalvalues.get.description = <p>This request returns the values of a geographic granularity that in turn are part of a theme or a system of specific indicators.</p><br><p>It is important to take into account that of the optional paratemers ( <strong>subjectCode</strong> and <strong>systemCode</strong>) may be one or none of them. If both are completed, only the last one will be taken into account.</p> <br>
api.doc.swagger.paths.geographicalvalues.get.parameters.subjectCode = Code of the topic from which you want to obtain the geographic values.
api.doc.swagger.paths.geographicalvalues.get.parameters.systemcode = Code of the indicator system from which the geographic values are to be obtained.
api.doc.swagger.paths.geographicalvalues.get.parameters.geographicalgranularitycode = Geographic granularity code.
api.doc.swagger.paths.geographicalvalues.get.summary = geographic values
api.doc.swagger.paths.indicators.get.tags = Indicators
api.doc.swagger.paths.indicators.get.description = <p>This request provides the list of indicators published in the ISTAC-indicadores data bank. An indicator is a measure used to know the intensity of a phenomenon in space-time. This measure can refer to different spatial or temporal granularities. For example, \\"Unemployment rate\\" is an indicator with different spatial granularities (insular, provincial and regional) and with the quarter as a single temporal granularity.</p><br>
api.doc.swagger.paths.indicators.get.parameters.q = Query. The metadata on which searches can be built are: \\"id\\", \\"subjectCode\\", \\"geographicalValue\\" and \\"geographicalGranularity\\".<br> Examples: < br>q=id EQ \\"REGISTERED_EMPLOYMENT\\" <br> q=subjectCode EQ \\"EDUCATION\\" AND geographicalValue EQ \\"ES\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=id IN (\\"CODE-1\\", \\"CODE-2\\").
api.doc.swagger.paths.indicators.get.parameters.order = Order. The possible values are \\"update\\" and \\"id\\" and the order criteria \\"asc\\" and \\"desc\\". <br> Example: order=update asc.
api.doc.swagger.paths.indicators.get.parameters.limit = Limit of results (maximum number). <br> Example: limit=10.
api.doc.swagger.paths.indicators.get.parameters.offset = Displacement. The result to return from. The default value is 0. <br> Example: offset=2.
api.doc.swagger.paths.indicators.get.parameters.fields = Allows you to customize the response by adding new fields. Possible values are: \\"+metadata\\", \\"+data\\" and \\"+observationsMetadata\\". <br> Example: fields=+metadata.
api.doc.swagger.paths.indicators.get.parameters.representation = Allows you to filter the data that is obtained in the response. Its use only makes sense when \\"+data\\" and/or \\"+observationsMetadata\\" have been included. To do this, it will suffice to specify the dimensions to be filtered and the values to obtain for each of them. For dimensions that do not specify any filter, all existing values will be obtained. Additionally, time dimensions allow the use of the ~last, ~after, and ~range modifiers. <br/>Examples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last=n will return the last n values of the time dimension. Usage example: representation=TIME[~last=2] <br/>- ~after=DATE will return dates after DATE, including itself. Usage example: representation=TIME[~after=2012-M02] <br/>- ~range=DATE1;DATE2 will return dates between and including DATE1 and DATE2. Usage example: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.get.summary = List of indicators
api.doc.swagger.paths.indicators.code.get.tags = Indicators
api.doc.swagger.paths.indicators.code.get.description = <p>An indicator is a measure used to know the intensity of a phenomenon in space-time. This measure can refer to different spatial granularities, e.g. islands and municipalities, or temporary, e.g. years and months. Through this request, the metadata that describes the characteristics of a specific indicator is offered, allowing the understanding of the measured fact; Likewise, through the data request, the complete data (for all space-times) of the indicator is provided.</p><br>
api.doc.swagger.paths.indicators.code.get.parameters.indicatorcode = Code of the indicator to obtain.
api.doc.swagger.paths.indicators.code.get.summary = Indicator
api.doc.swagger.paths.indicators.code.data.get.tags = Indicators
api.doc.swagger.paths.indicators.code.data.get.description = <p>An indicator is a measure used to know the intensity of a phenomenon in space-time. This measure can refer to different spatial granularities, e.g. islands and municipalities, or temporary, e.g. years and months. Through the data request, the complete data (for all space-times) of the indicator is provided. On the other hand, through the metadata request, the metadata that describes the characteristics of a specific indicator is offered, allowing the understanding of the measured fact.</p><br>
api.doc.swagger.paths.indicators.code.data.get.parameters.indicatorcode = Code of the indicator to obtain.
api.doc.swagger.paths.indicators.code.data.get.parameters.representation = Allows you to filter the data that is obtained in the response. To do this, it will suffice to specify the dimensions to be filtered and the values to obtain for each of them. For dimensions that do not specify any filter, all existing values will be obtained. Additionally, time dimensions allow the use of the ~last, ~after, and ~range modifiers. <br/>Examples: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last=n will return the last n values of the time dimension. Usage example: representation=TIME[~last=2] <br/>- ~after=DATE will return dates after DATE, including itself. Usage example: representation=TIME[~after=2012-M02] <br/>- ~range=DATE1;DATE2 will return dates between and including DATE1 and DATE2. Usage example: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.code.data.get.parameters.granularity = Allows you to filter the observations by their granularity. <br> Example: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicators.code.data.get.parameters.fields = Allows you to customize the response by excluding fields. Possible values are: \\"-observationsMetadata\\". <br> Example: fields=-observationsMetadata.
api.doc.swagger.paths.indicators.code.data.get.summary = Observations of an indicator
api.doc.swagger.paths.indicatorssystems.get.tags = Indicator systems
api.doc.swagger.paths.indicatorssystems.get.description = <p>This request provides the list of indicator systems published in the ISTAC-indicadores data bank. The indicators are simple or composite statistics, however a single indicator can rarely provide useful information about complex phenomena such as the economic situation, living conditions, schooling or others. Indicator systems are generally designed to generate more and more precise information about the conditions of a phenomenon; and for this they are organized into dimensions or areas of analysis, under which the indicators are integrated. In ISTAC, an indicator system is treated as a statistical operation, so more information about the system can be found in the operations API.</p><br>
api.doc.swagger.paths.indicatorssystems.get.parameters.limit = Limit of results (maximum number). <br> Example: limit=10.
api.doc.swagger.paths.indicatorssystems.get.parameters.offset = Displacement. The result to return from. The default value is 0. <br> Example: offset=2.
api.doc.swagger.paths.indicatorssystems.get.summary = List of indicator systems
api.doc.swagger.paths.indicatorssystems.code.get.tags = Indicator systems
api.doc.swagger.paths.indicatorssystems.code.get.description = <p>This request offers the metadata of a set of indicators published in the ISTAC-indicadores data bank. The indicators are simple or composite statistics, however a single indicator can rarely provide useful information about complex phenomena such as the economic situation, living conditions, schooling or others. Indicator systems are generally designed to generate more and more precise information about the conditions of a phenomenon; and for this they are organized into dimensions or areas of analysis, under which the indicators are integrated. In ISTAC, an indicator system is treated as a statistical operation, so more information about the system can be found in the operations API.</p><br>
api.doc.swagger.paths.indicatorssystems.code.get.parameters.indicatorsystemcode = System code to get.
api.doc.swagger.paths.indicatorssystems.code.get.summary = Indicator system
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.tags = Indicator systems
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.description = <p>This request returns the flag instances associated with a specific flag system. An instance of an indicator is nothing more than a spatio-temporal query of an indicator when incorporating it into a specific system of indicators. For example, the Registered Unemployment indicator is incorporated into the Municipal Indicators Yearbook system as a query (indicator instance) through which the municipal and annual data for the selected indicator. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.indicatorsystemcode = System code to get.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.q = Query. The metadata on which searches can be built are: \\"id\\", \\"geographicalValue\\" and \\"geographicalGranularity\\".<br> Examples: <br>q=id EQ \\"INDICADORES_MUNICIPALES\\" <br> q=geographicalValue EQ \\"ES\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=id IN (\\"CODE-1\\" , \\"CODE-2\\").
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.order = Order. The possible values are \\"update\\" and \\"id\\" and the order criteria \\"asc\\" and \\"desc\\". <br> Example: order=update asc.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.limit = Limit of results (maximum number). <br> Example: limit=10.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.offset = Displacement. The result to return from. The default value is 0. <br> Example: offset=2.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.fields = Allows you to customize the response by adding new fields. Possible values are: \\"+metadata\\", \\"+data\\" and \\"+observationsMetadata\\". <br> Example: fields=+metadata.
