api.doc.swagger.definitions.data.properties.observation = Array of observations. The observations are ordered by the combination of the categories, always keeping the first category of the first dimension fixed and iterating over the categories of the last dimension of the array. For example, given the dimensions A, B and C with 3, 2, and 4 categories respectively, the values will be ordered in such a way that first it iterates over the 4 categories of C, then over the two of B and finally over the 3 of A. In this example, the result would be: A1B1C1, A1B1C2, A1B1C3, A1B1C4, A1B2C1, A1B2C2, A1B2C3, A1B2C4, A2B1C1, A2B1C2, A2B1C3, A1B1C4, A2B2C1, A2B2C2, A2B2C3, A2B1C1, A3B2C1, A3B2C1, A3B1C4. A3B1C3, A3B1C4, A3B2C1, A3B2C2, A3B2C3, A3B2C4
