api.doc.swagger.paths.timegranularities.get.tags = Tables values auxiliary
api.doc.swagger.paths.timegranularities.get.description = <p>This request returns the list of temporal granularities processed in the ISTAC-indicators data bank ordered from highest to lowest granularity. For example annual, quarterly or monthly granularity.</p><br>
api.doc.swagger.paths.timegranularities.get.summary = Temporal granularities

