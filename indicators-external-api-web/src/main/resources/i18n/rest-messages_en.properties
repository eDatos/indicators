api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.granularity = Allows you to filter the observations by their granularity. Its use only makes sense when \\"+data\\" and/or \\"+observationsMetadata\\" have been included. <br> Example: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
