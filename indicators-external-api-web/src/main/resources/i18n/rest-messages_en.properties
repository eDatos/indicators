api.doc.swagger.title = Indicators API v1.0
api.doc.swagger.description = An indicator is a measure of the intensity of a phenomenon in space-time. This measure has data of different spatial granularities (for example: islands and municipalities), or of different temporal units (for example: years and months). A single indicator can rarely provide useful information about complex phenomena such as the economic situation, living conditions or schooling, among many others. The indicator systems are designed to provide more precise information about a phenomenon, and for this they are organized into dimensions or areas of analysis, under which the indicators are integrated. The purpose of this API is to allow access to data and metadata of: Indicator systems, indicators and indicator instances

