api.doc.swagger.definitions.quantity.properties.baselocation                                                   = Base espacial para un indicador tipo \u00EDndice (index) espacial o temporal. El ejemplo m\u00E1s caracter\u00EDstico de \u00EDndices espaciales son las Paridades de Poder Adquisitivo (PPA) que comparan los niveles de precios entre territorios, siendo el territorio base la referencia 100. Por ejemplo las PPA de Canarias comparan los niveles de precios entre islas, siendo el territorio base Canarias. Metadato asociado al tipo de medida index.
api.doc.swagger.definitions.quantity.properties.basequantitylink                                               = Referencia al indicador sobre el que se calcula una tasa de variaci\u00F3n. Metadato asociado al tipo de medida changerate.
api.doc.swagger.definitions.quantity.properties.basetime                                                       = Base temporal de un indicador tipo \u00EDndice (index) temporal. Por ejemplo, 2010. Metadato asociado al tipo de medida index.
api.doc.swagger.definitions.quantity.properties.basevalue                                                      = Valor de referencia de un \u00EDndice (index), generalmente baseValue = 100. Metadato asociado al tipo de medida index.
api.doc.swagger.definitions.quantity.properties.decimalplaces                                                  = Especifica el n\u00FAmero de decimales a utilizar para la visualizaci\u00F3n de los valores de un concepto m\u00E9trico.
api.doc.swagger.definitions.quantity.properties.denominatorlink                                                = Otro indicador del sistema que es el denominador del indicador tipo proporci\u00F3n. Por ejemplo, para el indicador \\"tasa de paro\\" ser\u00EDa el indicador \\"poblaci\u00F3n activa\\". Metadato asociado a los siguientes tipos de medida: fraction, ratio, rate, index y changerate.
api.doc.swagger.definitions.quantity.properties.ispercentege                                                   = Atributo booleano que toma el valor TRUE si una fracci\u00F3n es un porcentaje y FALSE en caso contrario. Metadato asociado a los siguientes tipos de medida: ratio, rate, index y changerate.
api.doc.swagger.definitions.quantity.properties.max                                                            = Especifica el valor m\u00E1ximo que puede tomar la magnitud. En el caso de una magnitud referenciada en una escala de intervalo (o de intensidad) indica el valor superior de la escala. Por ejemplo, para el Indice de Desarrollo Humano; max = 1. Metadato asociado a los siguientes tipos de medida: magnitude, fraction, ratio, rate, index y changerate
api.doc.swagger.definitions.quantity.properties.min                                                            = Especifica el valor m\u00EDnimo que puede tomar la magnitud. En el caso de una magnitud referenciada en una escala de intervalo (o de intensidad) indica el valor inferior de la escala. Por ejemplo, para el Indice de Desarrollo Humano; min = 0. Metadato asociado a los siguientes tipos de medida: magnitude, fraction, ratio, rate, index y changerate
api.doc.swagger.definitions.quantity.properties.numeratorlink                                                  = Otro indicador del sistema que es el numerador del indicador tipo proporci\u00F3n. Por ejemplo, para el indicador \\"tasa de paro\\" ser\u00EDa el indicador \\"poblaci\u00F3n parada\\". Metadato asociado a los siguientes tipos de medida: fraction, ratio, rate, index y changerate.
api.doc.swagger.definitions.quantity.properties.percentegeof                                                   = Si estamos ante un porcentaje, este atributo ofrece un texto descriptivo  que puede utilizarse para mostrarse junto al n\u00FAmero y especifica de qu\u00E9 se trata dicho porcentaje. Por ejemplo, la m\u00E9trica \\"tasa de desempleo\\" puede tener un atributo PercentageOf  \\"% de la poblaci\u00F3n activa\\" para que el valor se lea como \\"10,5% de la poblaci\u00F3n activa\\". Metadato asociado a los siguientes tipos de medida: ratio, rate, index y changerate.
api.doc.swagger.definitions.quantity.properties.significantdigits                                              = Especifica el n\u00FAmero de d\u00EDgitos significativos para utilizar cuando se muestran los valores de un concepto m\u00E9trico.
api.doc.swagger.definitions.quantity.properties.type                                                           = Existen diferentes tipos de medici\u00F3n (type) y asociados a cada una de ellos, diferentes metadatos que especifican mejor esa medida: medici\u00F3n (quantity), cantidad (amount), magnitud (magnitude), fracci\u00F3n (fraction),  ratio (ratio), tasa (rate), indice (index), tasa de variaci\u00F3n (changerate). Se ha usado la clasificaci\u00F3n utilizada por Google, en su est\u00E1ndar Dataset Publishing Language (DSPL).
api.doc.swagger.definitions.quantity.properties.unit                                                           = Define la unidad de medida de un indicador. Una unidad de medida es una cantidad estandarizada de una determinada magnitud, definida y adoptada por convenci\u00F3n o por ley, por ejemplo: unidades f\u00EDsica (kg, mm, \u00B0C, \u00B0F) o unidades monetarias (euros, pesetas, d\u00F3lares). Cualquier valor de una cantidad f\u00EDsica puede expresarse como un m\u00FAltiplo de la unidad de medida. Una unidad de medida toma su valor a partir de un patr\u00F3n o de una composici\u00F3n de otras unidades definidas previamente. Las primeras unidades se conocen como unidades b\u00E1sicas o de base (fundamentales), mientras que las segundas se llaman unidades derivadas. <br>Tambi\u00E9n consideramos como unidades de medida las especificaciones de simples recuentos (por ejemplo personas, veh\u00EDculos, viviendas).
api.doc.swagger.definitions.quantity.properties.unitmultiplier                                                 = Literal que especifica el multiplicador de la unidad de medida. Por ejemplo \\"Miles de personas\\". Metadato asociado a todos los tipos de medida.
api.doc.swagger.definitions.quantity.properties.unitsymbol                                                     = S\u00EDmbolo asociado a la unidad de medida, por ejemplo \\"km\\" para kil\u00F3metros. <br>Metadato asociado a todos los tipos de medida.
api.doc.swagger.definitions.quantity.properties.unitsymbolposition                                             = Posici\u00F3n del s\u00EDmbolo de la unidad de medida, que puede ser delante o detr\u00E1s de la cifra. <br>Metadato asociado a todos los tipos de medida.
api.doc.swagger.definitions.subject.properties.code                                                            = C\u00F3digo sem\u00E1ntico del recurso.
api.doc.swagger.definitions.subject.properties.id                                                              = Identificador del recurso.
api.doc.swagger.definitions.subject.properties.kind                                                            = Tipo del recurso.
api.doc.swagger.definitions.subject.properties.title                                                           = Nombre del tema estad\u00EDstico.
api.doc.swagger.definitions.subjectlist.properties.items                                                       = Listado de recursos.
api.doc.swagger.definitions.subjectlist.properties.kind                                                        = Tipo de recurso.
