api.doc.swagger.definitions.timegranularity.properties.code                                                    = C\u00F3digo de la granularidad temporal
api.doc.swagger.definitions.timegranularity.properties.title                                                   = Nombre de la granularidad temporal
api.doc.swagger.definitions.timerepresentation.properties.code                                                 = C\u00F3digo del momento de tiempo.
api.doc.swagger.definitions.timerepresentation.properties.granularitycode                                      = Granularidad del momento de tiempo.
api.doc.swagger.definitions.timerepresentation.properties.title                                                = Nombre del momento de tiempo.
api.doc.swagger.description                                                                                    = Un indicador es una medida de la intensidad de un fen\u00F3meno en el espacio-tiempo. Esa medida tiene datos de distintas granularidades espaciales (por ejemplo: islas y municipios), o de distintas unidades temporales (por ejemplo: a\u00F1os y meses). Un solo indicador rara vez puede proporcionar informaci\u00F3n \u00FAtil acerca de fen\u00F3menos complejos tales como la coyuntura econ\u00F3mica, las condiciones de vida o la escolarizaci\u00F3n entre tantos otros. Los sistemas de indicadores est\u00E1n dise\u00F1ados para aportar informaci\u00F3n m\u00E1s precisa sobre un fen\u00F3meno, y para ello se organizan en dimensiones o \u00E1reas de an\u00E1lisis, bajo las que se integran los indicadores. El objetivo de esta API es permitir el acceso a datos y metadatos de: Sistemas de indicadores, indicadores e instancias de indicadores
api.doc.swagger.paths.geographicalvalues.get.description                                                       = <p>Esta petici\u00F3n devuelve los valores de una granularidad geogr\u00E1fica que a su vez forman parte de un tema o un sistema de indicadores espec\u00EDficos.</p><br><p>Es importante tener en cuenta que de los par\u00E1metros opcionales (<strong>subjectCode</strong> y <strong>systemCode</strong>) podr\u00E1 estar cumplimentado uno de ellos o ninguno. En caso de que est\u00E9n cumplimentados ambos, s\u00F3lo se tendr\u00E1 en cuenta el \u00FAltimo.</p> <br>
api.doc.swagger.paths.geographicalvalues.get.parameters.geographicalgranularitycode                            = C\u00F3digo de la granularidad geogr\u00E1fica.
api.doc.swagger.paths.geographicalvalues.get.parameters.subjectCode                                            = C\u00F3digo del tema del que se desean obtener los valores geogr\u00E1ficos.
api.doc.swagger.paths.geographicalvalues.get.parameters.systemcode                                             = C\u00F3digo del sistema de indicadores del que se desean obtener los valores geogr\u00E1ficos.
api.doc.swagger.paths.geographicalvalues.get.summary                                                           = Valores geogr\u00E1ficos
api.doc.swagger.paths.geographicalvalues.get.tags                                                              = Tablas de valores auxiliares
api.doc.swagger.paths.geographicgranuarities.get.description                                                   = <p>Esta petici\u00F3n devuelve la lista de granularidades geogr\u00E1ficas tratadas en e-Indicadores. Por ejemplo granularidad provincial, insular o municipal.</p><br>
api.doc.swagger.paths.geographicgranuarities.get.summary                                                       = Granularidades geogr\u00E1ficas
api.doc.swagger.paths.geographicgranuarities.get.tags                                                          = Tablas de valores auxiliares
api.doc.swagger.paths.indicators.code.data.get.description                                                     = <p>Un indicador es una medida utilizada para conocer la intensidad de un fen\u00F3meno en el espacio-tiempo. Esa medida se puede referir a distintas granularidades espaciales, p.e. islas y municipios, o temporales, p.e. a\u00F1os y meses.  A trav\u00E9s de la petici\u00F3n data se aportan los datos completos (para todos los espacio-tiempo) del indicador. Por otra parte a trav\u00E9s de la petici\u00F3n metadata se ofrecen los metadatos que describen las caracter\u00EDsticas de un indicador espec\u00EDfico, pemitiendo la compresi\u00F3n del hecho medido.</p><br>
api.doc.swagger.paths.indicators.code.data.get.parameters.fields                                               = Permite personalizar la respuesta mediante la exclusi\u00F3n de campos. Los posibles valores son: \\"-observationsMetadata\\". <br> Ejemplo: fields=-observationsMetadata.
api.doc.swagger.paths.indicators.code.data.get.parameters.granularity                                          = Permite filtrar las observaciones mediante las granularidades de las mismas. <br> Ejemplo: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicators.code.data.get.parameters.indicatorcode                                        = C\u00F3digo del indicador a obtener.
api.doc.swagger.paths.indicators.code.data.get.parameters.representation                                       = Permite filtrar los datos que se obtienen en la respuesta. Para ello, bastar\u00E1 con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ning\u00FAn filtro se obtendr\u00E1n todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. <br/>Ejemplos: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last=n devolver\u00E1 los \u00FAltimos n valores de la dimensi\u00F3n temporal. Ejemplo de uso: representation=TIME[~last=2] <br/>- ~after=FECHA devolver\u00E1 las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 devolver\u00E1 las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.code.data.get.summary                                                         = Observaciones de un indicador
api.doc.swagger.paths.indicators.code.data.get.tags                                                            = Indicadores
api.doc.swagger.paths.indicators.code.get.description                                                          = <p>Un indicador es una medida utilizada para conocer la intensidad de un fen\u00F3meno en el espacio-tiempo. Esa medida se puede referir a distintas granularidades espaciales, p.e. islas y municipios, o temporales, p.e. a\u00F1os y meses. A trav\u00E9s de esta petici\u00F3n se ofrecen los metadatos que describen las caracter\u00EDsticas de un indicador espec\u00EDfico, pemitiendo la compresi\u00F3n del hecho medido; asimismo a trav\u00E9s de la petici\u00F3n data se aportan los datos completos (para todos los espacio-tiempo) del indicador.</p><br>
api.doc.swagger.paths.indicators.code.get.parameters.indicatorcode                                             = C\u00F3digo del indicador a obtener.
api.doc.swagger.paths.indicators.code.get.summary                                                              = Indicador
api.doc.swagger.paths.indicators.code.get.tags                                                                 = Indicadores
api.doc.swagger.paths.indicators.get.description                                                               = <p>Esta petici\u00F3n aporta la lista de indicadores publicados en e-Indicadores. Un indicador es una medida utilizada para conocer la intensidad de un fen\u00F3meno en el espacio-tiempo. Esa medida se puede referir a distintas granularidades espaciales o temporales. Por ejemplo \\"Tasa de paro\\" es un indicador con diversas granularidades espaciales (insular, provincial y auton\u00F3mica) y con el trimestre como una \u00FAnica granularidad temporal.</p><br>
api.doc.swagger.paths.indicators.get.parameters.fields                                                         = Permite personalizar la respuesta mediante la adici\u00F3n de nuevos campos. Los posibles valores son: \\"+metadata\\", \\"+data\\" y \\"+observationsMetadata\\". <br> Ejemplo: fields=+metadata.
api.doc.swagger.paths.indicators.get.parameters.limit                                                          = L\u00EDmite de resultados (n\u00FAmero m\u00E1ximo). <br> Ejemplo: limit=10.
api.doc.swagger.paths.indicators.get.parameters.offset                                                         = Desplazamiento. Resultado a partir del que se devuelve. El valor por defecto es 0. <br> Ejemplo: offset=2.
api.doc.swagger.paths.indicators.get.parameters.order                                                          = Orden. Los posibles valores son \\"update\\" e \\"id\\" y los criterios de orden \\"asc\\" y \\"desc\\". <br> Ejemplo: order=update asc.
api.doc.swagger.paths.indicators.get.parameters.q                                                              = Consulta. Los metadatos sobre los que se pueden construir las b\u00FAsquedas son: \\"id\\", \\"subjectCode\\", \\"geographicalValue\\", \\"geographicalGranularity\\", \\"temporalGranularity\\" y \\"isMainIndicator\\". <br> Ejemplos: <br> q=id EQ \\"PARO_REGISTRADO\\" <br> q=subjectCode EQ \\"EDUCACION\\" AND geographicalValue EQ \\"ES\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=temporalGranularity EQ \\"YEARLY\\" <br> q=id IN (\\"CODE-1\\", \\"CODE-2\\") <br> q=isMainIndicator EQ \\"TRUE\\".
api.doc.swagger.paths.indicators.get.parameters.representation                                                 = Permite filtrar los datos que se obtienen en la respuesta. Su uso s\u00F3lo tiene sentido cuando se ha inclu\u00EDdo \\"+data\\" y/o \\"+observationsMetadata\\". Para ello, bastar\u00E1 con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ning\u00FAn filtro se obtendr\u00E1n todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. <br/>Ejemplos: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last=n devolver\u00E1 los \u00FAltimos n valores de la dimensi\u00F3n temporal. Ejemplo de uso: representation=TIME[~last=2] <br/>- ~after=FECHA devolver\u00E1 las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 devolver\u00E1 las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicators.get.summary                                                                   = Listado de indicadores
api.doc.swagger.paths.indicators.get.tags                                                                      = Indicadores
api.doc.swagger.paths.indicatorssystems.code.get.description                                                   = <p>Esta petici\u00F3n ofrece los metadatos de un sistema de indicadores publicado en e-Indicadores. Los indicadores son estad\u00EDsticas simples o compuestas, sin embargo un solo indicador rara vez puede proporcionar informaci\u00F3n \u00FAtil acerca de fen\u00F3menos complejos tales como la coyuntura econ\u00F3mica, las condiciones de vida, la escolarizaci\u00F3n u otros. Los sistemas de indicadores generalmente est\u00E1n dise\u00F1ados para generar informaci\u00F3n m\u00E1s precisa acerca de las condiciones de un fen\u00F3meno; y para ello se organizan en dimensiones o \u00E1reas de an\u00E1lisis, bajo las cuales se integran los indicadores. Un sistema de indicadores se trata como una operaci\u00F3n estad\u00EDstica, por lo que se puede consultar m\u00E1s informaci\u00F3n del sistema en la API de operaciones.</p><br>
api.doc.swagger.paths.indicatorssystems.code.get.parameters.indicatorsystemcode                                = C\u00F3digo del sistema a obtener.
api.doc.swagger.paths.indicatorssystems.code.get.summary                                                       = Sistema de indicadores
api.doc.swagger.paths.indicatorssystems.code.get.tags                                                          = Sistemas de indicadores
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.description                      = <p>Esta petici\u00F3n devuelve los datos de una instancia de indicadores asociada a un sistema de indicadores espec\u00EDfico. Una instancia de un indicador no es m\u00E1s que una consulta espacio-temporal de un indicador a la hora de incorporarlo a un sistema de indicadores concreto. Por ejemplo, el indicador Paro registrado se incorpora al sistema Anuario de Indicadores Municipales como una consulta (instancia de indicador) a trav\u00E9s de la cual se seleccionan los datos municipales y anuales de dicho indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.fields                = Permite personalizar la respuesta mediante la exclusi\u00F3n de campos. Los posibles valores son: \\"-observationsMetadata\\". <br> Ejemplo: fields=-observationsMetadata.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.granularity           = Permite filtrar las observaciones mediante las granularidades de las mismas. <br> Ejemplo: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.indicatorinstancecode = C\u00F3digo de la instancia a obtener.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.indicatorsystemcode   = C\u00F3digo del sistema a obtener.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.parameters.representation        = Permite filtrar los datos que se obtienen en la respuesta. Para ello, bastar\u00E1 con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ning\u00FAn filtro se obtendr\u00E1n todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. <br/>Ejemplos: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last=n devolver\u00E1 los \u00FAltimos n valores de la dimensi\u00F3n temporal. Ejemplo de uso: representation=TIME[~last=2] <br/>- ~after=FECHA devolver\u00E1 las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 devolver\u00E1 las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.summary                          = Observaciones instancia de indicador
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.data.get.tags                             = Sistemas de indicadores
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.description                           = <p>Esta petici\u00F3n devuelve los metadatos de una instancia de indicadores asociada a un sistema de indicadores espec\u00EDfico. Una instancia de un indicador no es m\u00E1s que una consulta espacio-temporal de un indicador a la hora de incorporarlo a un sistema de indicadores concreto. Por ejemplo, el indicador Paro registrado se incorpora al sistema Anuario de Indicadores Municipales como una consulta (instancia de indicador) a trav\u00E9s de la cual se seleccionan los datos municipales y anuales de dicho indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.parameters.indicatorinstancecode      = C\u00F3digo de la instancia a obtener.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.parameters.indicatorsystemcode        = C\u00F3digo del sistema a obtener.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.summary                               = Instancia de un sistema de indicadores
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.code.get.tags                                  = Sistemas de indicadores
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.description                                = <p>Esta petici\u00F3n devuelve las instancias de indicadores asociadas a un sistema de indicadores espec\u00EDfico. Una instancia de un indicador no es m\u00E1s que una consulta espacio-temporal de un indicador a la hora de incorporarlo a un sistema de indicadores concreto. Por ejemplo, el indicador Paro registrado se incorpora al sistema Anuario de Indicadores Municipales como una consulta (instancia de indicador) a trav\u00E9s de la cual se seleccionan los datos municipales y anuales de dicho indicador. </p><br>
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.fields                          = Permite personalizar la respuesta mediante la adici\u00F3n de nuevos campos. Los posibles valores son: \\"+metadata\\", \\"+data\\" y \\"+observationsMetadata\\". <br> Ejemplo: fields=+metadata.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.granularity                     = Permite filtrar las observaciones mediante las granularidades de las mismas. Su uso s\u00F3lo tiene sentido cuando se ha inclu\u00EDdo \\"+data\\" y/o \\"+observationsMetadata\\". <br> Ejemplo: granularity=GEOGRAPHICAL[MUNICIPALITIES|PROVINCES],TIME[MONTHLY].
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.indicatorsystemcode             = C\u00F3digo del sistema a obtener.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.limit                           = L\u00EDmite de resultados (n\u00FAmero m\u00E1ximo). <br> Ejemplo: limit=10.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.offset                          = Desplazamiento. Resultado a partir del que se devuelve. El valor por defecto es 0. <br> Ejemplo: offset=2.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.order                           = Orden. Los posibles valores son \\"update\\" e \\"id\\" y los criterios de orden \\"asc\\" y \\"desc\\". <br> Ejemplo: order=update asc.
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.q                               = Consulta. Los metadatos sobre los que se pueden construir las b\u00FAsquedas son: \\"id\\", \\"geographicalValue\\",\\"geographicalGranularity\\" y \\"temporalGranularity\\". <br> Ejemplos: <br> q=id EQ \\"INDICADORES_MUNICIPALES\\" <br> q=geographicalValue EQ \\"ES\\" <br> q=geographicalGranularity EQ \\"MUNICIPALITIES\\" <br> q=temporalGranularity EQ \\"YEARLY\\" <br> q=id IN (\\"CODE-1\\", \\"CODE-2\\").
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.parameters.representation                  = Permite filtrar los datos que se obtienen en la respuesta. Su uso s\u00F3lo tiene sentido cuando se ha inclu\u00EDdo \\"+data\\" y/o \\"+observationsMetadata\\". Para ello, bastar\u00E1 con especificar las dimensiones que se quieren filtrar y los valores a obtener para cada una de ellas. De las dimensiones que no se especifique ning\u00FAn filtro se obtendr\u00E1n todos los valores existentes. De manera adicional, las dimensiones temporales permiten el uso de los modificadores ~last, ~after y ~range. <br/>Ejemplos: <br/>- representation=GEOGRAPHICAL[35003|35005],MEASURE[ABSOLUTE]<br/>- representation=TIME[2009|2010],MEASURE[INDICE_OCUPACION_PLAZAS] <br/>- ~last=n devolver\u00E1 los \u00FAltimos n valores de la dimensi\u00F3n temporal. Ejemplo de uso: representation=TIME[~last=2] <br/>- ~after=FECHA devolver\u00E1 las fechas posteriores a FECHA, incluida ella misma. Ejemplo de uso: representation=TIME[~after=2012-M02] <br/>- ~range=FECHA1;FECHA2 devolver\u00E1 las fechas entre FECHA1 y FECHA2, ambas incluidas. Ejemplo de uso: representation=TIME[~range=2012;2013]
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.summary                                    = Instancias de sistema de indicadores
api.doc.swagger.paths.indicatorssystems.code.indicatorsinstance.get.tags                                       = Sistemas de indicadores
api.doc.swagger.paths.indicatorssystems.get.description                                                        = <p>Esta petici\u00F3n aporta la lista de sistemas de indicadores publicados en e-Indicadores. Los indicadores son estad\u00EDsticas simples o compuestas, sin embargo un solo indicador rara vez puede proporcionar informaci\u00F3n \u00FAtil acerca de fen\u00F3menos complejos tales como la coyuntura econ\u00F3mica, las condiciones de vida, la escolarizaci\u00F3n u otros. Los sistemas de indicadores generalmente est\u00E1n dise\u00F1ados para generar m\u00E1s y m\u00E1s precisa informaci\u00F3n acerca de las condiciones de un fen\u00F3meno; y para ello se organizan en dimensiones o \u00E1reas de an\u00E1lisis, bajo las cu\u00E1les se integran los indicadores. Un sistema de indicadores se trata como una operaci\u00F3n estad\u00EDstica, por lo que se puede consultar m\u00E1s informaci\u00F3n del sistema en la API de operaciones.</p><br>
api.doc.swagger.paths.indicatorssystems.get.parameters.limit                                                   = L\u00EDmite de resultados (n\u00FAmero m\u00E1ximo). <br> Ejemplo: limit=10.
api.doc.swagger.paths.indicatorssystems.get.parameters.offset                                                  = Desplazamiento. Resultado a partir del que se devuelve. El valor por defecto es 0. <br> Ejemplo: offset=2.
api.doc.swagger.paths.indicatorssystems.get.parameters.order                                                   = Orden. Los posibles valores  \\"id\\" y los criterios de orden \\"asc\\" y \\"desc\\". <br> Ejemplo: order=id asc.
api.doc.swagger.paths.indicatorssystems.get.parameters.q                                                       = Consulta. Los metadatos sobre los que se pueden construir las b\u00FAsquedas son: \\"id\\", \\"operational\\". <br> Ejemplos: <br> q=id EQ \\"C00075A\\" <br> q=OPERATIONAL EQ \\"TRUE\\".
