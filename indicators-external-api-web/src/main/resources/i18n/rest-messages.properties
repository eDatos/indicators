api.doc.swagger.definitions.subjectlist.properties.total                                                       = N\u00FAmero total de resultados existentes.
api.doc.swagger.definitions.timedimension.properties.code                                                      = C\u00F3digo de la dimensi\u00F3n.
api.doc.swagger.definitions.timedimension.properties.granularity                                               = Granularidades que intervienen en la dimensi\u00F3n.
api.doc.swagger.definitions.timedimension.properties.representation                                            = Representaci\u00F3n de la dimensi\u00F3n. Indica como se codifica la dimensi\u00F3n.
